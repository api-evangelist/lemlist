note: >-
  lemlist publishes its own Agent Skill. It is saved here verbatim as
  lemlist-outreach-agent.md — the same body is served from both
  https://developer.lemlist.com/skill.md and
  https://developer.lemlist.com/.well-known/agent-skills/default/skill.md, and the
  A2A agent card's single skill points at the latter. The three
  lemlist-launch-campaign / lemlist-enrich-and-sync / lemlist-monitor-and-reply skills
  are API Evangelist-generated and grounded in the operations the published OpenAPI
  actually declares — they exist because lemlist's own skill lists "API equivalent"
  paths that its OpenAPI does not declare (POST /people-database/search where the spec
  has POST /database/people, POST /contacts/push which the spec does not declare at
  all, and /inbox/conversations/* where the spec has /inbox/*). Both are kept: the
  provider's is what lemlist tells agents, ours is what the contract supports.
