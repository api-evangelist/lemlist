source: mcp/lemlist-mcp.yml + openapi/_original/lemlist-openapi-v2.json
note: >-
  The lemlist OpenAPI declares operationId on only 5 of its 143 operations, so REST
  bindings below are expressed as `METHOD path` — the only stable identifier the
  provider's own spec offers. Where an operationId does exist it is given. The live
  MCP tools/list is auth-gated, so tools are mapped by the names lemlist publishes in
  its Agent Skill and /lemlist-agent prompt, matched to REST operations by semantics;
  confidence is set accordingly. lemlist's Agent Skill lists "API equivalent" paths
  that do NOT all match the published OpenAPI (it shows POST /people-database/search
  where the spec has POST /database/people, and POST /campaigns/{id}/sequences where
  the spec has POST /sequences/{sequenceId}/steps) — the spec paths are used here and
  the divergence is recorded per row.
