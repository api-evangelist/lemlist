mcp_only:
- tool: compose_messages
  reason: Message-copy generation is a server-side AI composite; no public REST operation
    in the OpenAPI produces sequence copy.
- tool: check_domain_health
  reason: Sending-domain DNS/blacklist health is documented for the MCP surface and
    the Deliverability Hub but has no published REST operation; the spec's nearest
    surface is the Deliverability alerts CRUD, which is a different capability.
- tool: send_inbox_sms
  reason: The Agent Skill lists an SMS send tool, and SMS activity events exist in
    the webhook catalog, but the published OpenAPI declares only email, LinkedIn and
    WhatsApp inbox send operations.
