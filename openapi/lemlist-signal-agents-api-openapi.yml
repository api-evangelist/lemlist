    WatchListApiWatchListResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WatchListSchema'
    WatchListConfigHistoryEntry:
      type: object
      description: A past configuration version of a Signal Agent, active during [startDate, endDate).
      properties:
        _id:
          type: string
          description: History entry identifier
        startDate:
          type: string
          description: When this configuration version became active
          format: date-time
        endDate:
          type: string
          description: When this configuration version was replaced
          format: date-time
        createdBy:
          type: string
          description: User id that made the change
        name:
          type: string
          description: Signal Agent name at capture time
        emoji:
          type: string
          description: Emoji at capture time
        type:
          type: string
          description: Signal type
          enum:
          - companyIsHiring
          - companyRaisedFunds
          - recruitmentCampaign
          - jobChange
          - newHire
          - companyEmployeeVisitedMyWebsite
          - customSignals
          - competitorConnections
          - competitorReactions
          - companyFollowers
          - technologyChange
          - linkedinPeopleProfile
          - linkedinCompanyProfile
          - mergersAcquisitions
          - promotion
          - linkedinKeywords
          - externalSignalContact
          - externalSignalCompany
          - buyingIntent
        entity:
          type: string
          description: Entity kind
          enum:
          - contact
          - company
        segmentType:
          type: string
          description: Segment sourcing
          enum:
          - all
          - list
          - csv
        filters:
          type: array
          items:
            $ref: '#/components/schemas/WatchListFilter'
        signalProcessingType:
          type: string
          description: Signal processing type
          enum:
          - manual
          - create_opportunity
          - push_to_campaign
        stats:
          type: object
          description: Signal/campaign stats computed for the window [startDate, endDate).
          properties:
            signalsCount:
              type: integer
              description: Number of signals detected in the window
            campaigns:
              type: array
              description: Per-campaign breakdown (push_to_campaign agents only)
              items:
                type: object
    WatchListFilter:
      type: object
      description: A filter narrowing which entities or events a Signal Agent tracks. `in` includes matching
        values, `out` excludes them.
      required:
      - filterId
      properties:
        filterId:
          type: string
          description: Filter identifier
          enum:
          - title
          - description
          - location
          - visitLocation
          - website
          - pagesTracked
          - minVisitDuration
          - minPageViewed
          - internalTraffic
          - linkedinUrls
          - companyLinkedinUrls
          - companyNames
          - companyLocation
          - companyIndustries
          - companySizes
          - maxIdentificationsPerDay
          - excludedVisitorIps
          - reactionTypes
          - linkedinTopics
          - bomboraTopics
          - watcherWatchKey
          - questions
          - fundraisingMinAmount
          - fundraisingMaxAmount
          - fundraisingInvestmentTypes
          - fundraisingInvestors
          - technologies
          - detectionMode
          - maDealTypes
          - maMinAmount
          - persona
          - externalSignalFieldMapping
          - externalSignalCustomFieldMapping
          - seniority
          - crmListIds
          - minJobCount
          - timeframe
        in:
          type: array
          description: Values to include
          items:
            type: string
        out:
          type: array
          description: Values to exclude
          items:
            type: string
    WatchListFilterDescriptor:
      type: object
      description: Describes a filter that can be set on a Signal Agent of a given type.
      properties:
        filterId:
          type: string
          description: Filter identifier
        name:
          type: string
          description: Human-readable filter name
        properties:
          type: array
          description: Filter sides supported by this filter
          items:
            type: string
            enum:
            - in
            - out
        required:
          type: array
          description: Filter sides that must be non-empty
          items:
            type: string
            enum:
            - in
            - out
        default:
          description: Default value, when the filter has one
        min:
          type: number
          description: Minimum value (numeric filters)
        max:
          type: number
          description: Maximum value (numeric filters)
    WatchListLibraryEntry:
      type: object
      properties:
        type:
          type: string
          description: Signal type identifier
          enum:
          - companyIsHiring
          - companyRaisedFunds
          - recruitmentCampaign
          - jobChange
          - newHire
          - companyEmployeeVisitedMyWebsite
          - customSignals
          - competitorConnections
          - competitorReactions
          - companyFollowers
          - technologyChange
          - linkedinPeopleProfile
          - linkedinCompanyProfile
          - mergersAcquisitions
          - promotion
          - linkedinKeywords
          - externalSignalContact
          - externalSignalCompany
          - buyingIntent
        title:
          type: string
          description: Display title
        description:
          type: string
          description: What this signal detects
    WatchListListMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page:
              type: integer
              description: Current page number
            limit:
              type: integer
              description: Number of records per page
            totalRecords:
              type: integer
              description: Total records matching the filter
            totalPages:
              type: integer
              description: Total number of pages
    WatchListSchema:
      type: object
      description: A Signal Agent (watch list) configuration.
      properties:
        _id:
          type: string
          description: Unique Signal Agent identifier
        name:
          type: string
          description: Display name
        type:
          type: string
          description: Signal type monitored by this Signal Agent
          enum:
          - companyIsHiring
          - companyRaisedFunds
          - recruitmentCampaign
          - jobChange
          - newHire
          - companyEmployeeVisitedMyWebsite
          - customSignals
          - competitorConnections
          - competitorReactions
          - companyFollowers
          - technologyChange
          - linkedinPeopleProfile
          - linkedinCompanyProfile
          - mergersAcquisitions
          - promotion
          - linkedinKeywords
          - externalSignalContact
          - externalSignalCompany
          - buyingIntent
        status:
          type: string
          description: Lifecycle status
          enum:
          - active
          - inactive
          - draft
          - insufficient_credits
          - empty_crm_lists
          - error
          - delete
        entity:
          type: string
          description: Entity kind the agent tracks
          enum:
          - contact
          - company
        segmentType:
          type: string
          description: How the monitored entities are sourced
          enum:
          - all
          - list
          - csv
        signalProcessingType:
          type: string
          description: How detected signals are processed
          enum:
          - manual
          - create_opportunity
          - push_to_campaign
        signalOpportunityTemplate:
          type: object
          description: Task/opportunity template applied to each signal when signalProcessingType is create_opportunity.
          properties:
            ownerType:
              type: string
              description: Who the created opportunity is assigned to
              enum:
              - contact_owner
              - specific_owner
            ownerId:
              type: string
              description: Owner user id, when ownerType is specific_owner
            type:
              type: string
              description: Opportunity channel
              enum:
              - email
              - phone
              - linkedinSend
              - whatsappMessage
              - manual
            priority:
              type: integer
              description: Opportunity priority
              enum:
              - 0
              - 1
              - 2
            data:
              type: object
              properties:
                title:
                  type: string
                  description: Opportunity title
                subject:
                  type: string
                  description: Email subject (email channel)
                emailTemplateId:
                  type: string
                  description: Email template id
                message:
                  type: string
                  description: Message body
        filters:
          type: array
          description: Filters narrowing which entities/events are tracked
          items:
            $ref: '#/components/schemas/WatchListFilter'
        emoji:
          type: string
          description: Emoji shown next to the agent name
