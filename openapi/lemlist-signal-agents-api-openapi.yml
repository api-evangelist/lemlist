              type: boolean
              description: Whether a document was removed
            deletedCount:
              type: integer
              description: Number of documents removed
    WatchListApiFetchSignalsResponse:
      type: object
      description: Paginated response containing signals detected by Signal Agents
      properties:
        data:
          type: array
          description: Signals matching the query parameters
          items:
            $ref: '#/components/schemas/SignalSchema'
        meta:
          $ref: '#/components/schemas/WatchListListMeta'
    WatchListApiFilterValuesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            filterId:
              type: string
              description: Resolved filter identifier
            results:
              type: array
              nullable: true
              description: Resolved values, or null when the filter resolves nothing
              items:
                type: string
    WatchListApiFiltersResponse:
      type: object
      properties:
        data:
          type: object
          description: Allowed filters keyed by signal type
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/WatchListFilterDescriptor'
    WatchListApiHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
