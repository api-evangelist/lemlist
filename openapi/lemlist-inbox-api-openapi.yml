  /inbox/conversations/labels/{contactId}:
    post:
      summary: Attach Labels to Conversations
      description: Attaches one or more labels to one or more conversations.
      tags:
      - Inbox
      parameters:
      - name: contactId
        in: path
        required: true
        description: Contact ID
        example: ctc_ei6zVayP9B2ugwUPN
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                labelIds:
                  type: array
                  description: Array of label IDs to attach
                  items:
                    type: string
                appendLabels:
                  type: boolean
                  description: If true, appends labels to existing ones. If false, replaces all labels.
              required:
              - labelIds
              - appendLabels
            example:
              labelIds:
              - lbl_uPAAgsi4oi9juBHfW
              - lbl_oZCShmPCP2L43b8qf
              appendLabels: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        '400':
          description: 'Possible errors: Bad team / Invalid request body: labelIds must be an array and
            appendLabels must be a boolean'
          content:
            text/plain:
              example: 'Invalid request body: labelIds must be an array and appendLabels must be a boolean'
        '401':
          description: The authentication you supplied is incorrect
          content:
            text/plain:
