                  type: string
                  description: Contact ID
                leadId:
                  type: string
                  description: Lead ID
                message:
                  type: string
                  description: Message content
              required:
              - sendUserId
              - sendUserWhatsappAccountId
              - contactId
              - leadId
              - message
            example:
