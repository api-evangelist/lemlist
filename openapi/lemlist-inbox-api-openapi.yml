components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    InboxConversation:
      type: object
      description: A message thread between a user and a contact in the inbox.
      properties:
        _id:
          type: string
        leadId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxMessage'
        createdAt:
          type: string
          format: date-time
    InboxMessage:
      type: object
      description: A single message within an inbox conversation.
      properties:
        _id:
          type: string
        conversationId:
          type: string
        sender:
          type: string
        recipient:
          type: string
        body:
          type: string
        sentAt:
          type: string
          format: date-time
    Label:
      type: object
      description: A label used to categorize and organize inbox conversations.
      properties:
        _id:
          type: string
          description: Unique label identifier
        name:
          type: string
          description: Label name
        color:
          type: string
          description: Hex color code for the label
        createdAt:
          type: string
          format: date-time
          description: Date and time when the label was created
          nullable: true
        createdBy:
          type: string
          description: Email of the user who created the label
          nullable: true
