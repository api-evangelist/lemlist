  /inbox/{contactId}/drafts:
    get:
      summary: List Drafts
      description: Lists all non-deleted drafts for a specific contact.
      tags:
      - Inbox
      parameters:
      - name: contactId
        in: path
        required: true
        description: Contact ID
        example: ctc_ei6zVayP9B2ugwUPN
        schema:
          type: string
      - name: draftOwner
        in: query
        required: true
        description: Draft owner identifier. Accepts either a userId (e.g., `usr_abc123def456789`) or
          a login email (e.g., `john@acme.com`).
        example: usr_abc123def456789
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  drafts:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: Unique draft identifier
                        channel:
                          type: string
                          enum:
                          - email
                          - linkedin
                          - whatsapp
                          - sms
                          description: Communication channel
                        subject:
                          type: string
                          description: Draft subject
                        contentPreview:
                          type: string
                          description: Content preview (max 100 chars)
                        source:
                          type: string
                          enum:
                          - api
                          - ui
                          description: Draft creation source
                        createdAt:
                          type: string
                          format: date-time
                          description: Creation date
                        updatedAt:
                          type: string
                          format: date-time
                          description: Last update date
              example:
                drafts:
                - _id: drf_abc123def456789
                  channel: email
                  subject: Follow up on our meeting
                  contentPreview: Hi John, I wanted to follow up on our conversation from last week...
                  source: api
                  createdAt: '2025-01-15T10:30:00.000Z'
                  updatedAt: '2025-01-15T10:30:00.000Z'
        '400':
          description: 'Possible errors: Missing draftOwner / User not found'
          content:
            text/plain:
              example: 'User not found: neither a valid email nor a valid user id for this team'
        '401':
          description: The authentication you supplied is incorrect
          content:
            text/plain:
              example: The authentication you supplied is incorrect
        '405':
          description: Method not allowed
    post:
      summary: Create Draft
      description: Creates a new draft for a specific contact. The source is automatically set to "api".
      tags:
      - Inbox
      parameters:
      - name: contactId
        in: path
        required: true
        description: Contact ID
        example: ctc_ei6zVayP9B2ugwUPN
        schema:
          type: string
      - name: draftOwner
        in: query
        required: true
        description: Draft owner identifier. Accepts either a userId (e.g., `usr_abc123def456789`) or
          a login email (e.g., `john@acme.com`).
        example: usr_abc123def456789
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - email
                  - linkedin
                  - whatsapp
                  - sms
                  description: Communication channel
                content:
                  type: string
                  description: Draft content (max 30KB)
                subject:
                  type: string
                  description: Draft subject (optional)
                cc:
                  type: array
                  items:
                    type: string
                  description: CC email addresses (optional)
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Attachment file name
                      url:
                        type: string
                        description: Attachment URL
                      size:
                        type: integer
                        description: File size in bytes
                      type:
                        type: string
                        description: MIME type
                  description: File attachments (optional)
                replyToActivityId:
                  type: string
                  description: Activity ID to reply to (optional)
                sourceMetadata:
                  type: object
                  description: Additional metadata (optional)
              required:
              - channel
              - content
            example:
              channel: email
              content: <p>Hello John, I wanted to follow up on our conversation.</p>
              subject: Follow up on our meeting
              cc: []
              attachments: []
      responses:
        '201':
          description: Draft created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftId:
                    type: string
                    description: ID of the created draft
              example:
                draftId: drf_abc123def456789
        '400':
          description: 'Possible errors: Missing draftOwner / Invalid channel / Content must not be empty
            / Content too large / Draft limit reached (max 10 per conversation) / User not found'
          content:
            text/plain:
              example: Content must not be empty
        '401':
          description: The authentication you supplied is incorrect
          content:
            text/plain:
              example: The authentication you supplied is incorrect
        '405':
          description: Method not allowed
