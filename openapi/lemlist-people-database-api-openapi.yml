openapi: 3.2.0
info:
  title: Lemlist People database API
  version: 1.0.0
  description: 'Operations tagged People database across 3 of this provider''s published API definitions: lemlist-openapi-v1-legacy.json, lemlist-openapi-v2.json, lemlist-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.lemlist.com/api
tags:
- name: People database
paths:
  /database/filters:
    parameters: []
    get:
      summary: Filters
      tags:
      - People database
      parameters:
      - name: Content
        in: header
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    filterId:
                      type: string
                    description:
                      type: string
                    mode:
                      type: array
                      items:
                        type: string
                    type:
                      type: string
                    helper:
                      type: string
              example:
              - filterId: filterId
                description: filterId description
                mode:
                - leads
                - companies
                type: text
                helper: Use free text search (to fill the in and/or out array)
    servers:
    - url: https://api.lemlist.com/api
  /database/people:
    parameters: []
