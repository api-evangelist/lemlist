                    type: array
                    items: {}
                  total:
                    type: integer
                  took:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
                  search:
                    type: string
                  limitation:
                    type: integer
                  team:
                    type: string
              example:
                results: []
                total: 18540918
                took: 903
                page: 1
                size: 100
                search: lsh_ENeC6oBSdwSArkywL
                limitation: 999
                team: tea_MtScZ2GexXzHXRdTr
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      filterId:
                        type: string
                      in:
                        type: array
