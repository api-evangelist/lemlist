openapi: 3.2.0
info:
  title: Lemlist Enrich API
  version: 1.0.0
  description: 'Operations tagged Enrich across 3 of this provider''s published API definitions: lemlist-openapi-v1-legacy.json, lemlist-openapi-v2.json, lemlist-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.lemlist.com/api
tags:
- name: Enrich
paths:
  /enrich/{enrichId}:
    parameters:
    - name: enrichId
      in: path
      required: true
      example: '{{enrichId}}'
      schema:
        type: string
    get:
      summary: Enrich
      tags:
      - Enrich
      parameters:
      - name: Content
        in: header
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '200':
          headers:
            Date:
              schema:
                type: string
              example: Thu, 25 Jul 2024 12:43:46 GMT
            Content-Type:
              schema:
                type: string
              example: application/json
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            alt-svc:
              schema:
                type: string
              example: h3=":443"; ma=86400
            retry-after:
              schema:
                type: integer
              example: '2'
            strict-transport-security:
              schema:
                type: string
              example: max-age=31536000;
            x-cache-debug:
              schema:
                type: string
              example: api.lemlist.com.main
            x-ratelimit-limit:
              schema:
                type: integer
              example: '20'
            x-ratelimit-remaining:
              schema:
                type: integer
              example: '19'
            x-ratelimit-reset:
              schema:
                type: string
              example: Thu Jul 25 2024 14:43:48 GMT+0200 (Central European Summer Time)
            CF-Cache-Status:
              schema:
                type: string
              example: DYNAMIC
            Report-To:
              schema:
                type: string
              example: '{"endpoints":[{"url":"https:\/\/a.nel.cloudflare.com\/report\/v4?s=DQ1KfiXbkGxHGj7Z7KRjPRGp1%2BchU%2B4NBnZh1gGrfjVi7MYzfE4PxdmrJ6Ms2BqbDg1Wyp7rFPrpcgzyvSz73zdSKNAL0wFT3YO6ouBfcPweCzJ05%2FTn8jPI%2FFDv7bpXOf4%3D"}],"group":"cf-nel","max_age":604800}'
            NEL:
              schema:
                type: string
              example: '{"success_fraction":0,"report_to":"cf-nel","max_age":604800}'
            Server:
              schema:
                type: string
              example: cloudflare
            CF-RAY:
              schema:
                type: integer
              example: 8a8c3ccbb83ac991-IAD
            Content-Encoding:
              schema:
                type: string
              example: br
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichmentId:
                    type: string
                  enrichmentStatus:
                    type: string
                  input:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                      linkedinUrl:
                        type: string
                        format: uri
                      companyName:
                        type: string
                      companyDomain:
                        type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                          notFound:
                            type: boolean
              example:
                enrichmentId: enr_Peve9ExBG9XqwrmeM
                enrichmentStatus: done
                input:
                  firstName: John
                  lastName: Lempire
                  linkedinUrl: https://www.linkedin.com/in/lempire
                  companyName: lempire
                  companyDomain: lempire.com
                data:
                  email:
                    email: john@lempire.co
                    notFound: false
        '202':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: In progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichmentId:
                    type: string
                  enrichmentStatus:
                    type: string
                  input:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                      linkedinUrl:
                        type: string
                        format: uri
                      companyName:
                        type: string
                      companyDomain:
                        type: string
                  data:
                    type: object
              example:
                enrichmentId: enr_rPAyaF4ASG9YWL3wk
                enrichmentStatus: in-progress
                input:
                  firstName: John
                  lastName: Lempire
                  linkedinUrl: https://www.linkedin.com/in/lempire
                  companyName: lempire
                  companyDomain: lempire.com
                data: {}
        '404':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrichmentId:
                    type: string
                  enrichmentStatus:
                    type: string
                  error:
                    type: string
                  data:
                    type: object
              example:
                enrichmentId: enr_t3WsF23sActKexff
                enrichmentStatus: not-found
                error: Enrichment not found
                data: {}
    servers:
    - url: https://api.lemlist.com/api
  /enrich:
    parameters: []
    post:
      summary: Enrich
      tags:
      - Enrich
      parameters:
      - name: findEmail
        in: query
        required: false
        description: 'Boolean | Find verified email | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: verifyEmail
        in: query
        required: false
        description: 'Boolean | Verify existing email (debounce) | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: linkedinEnrichment
        in: query
        required: false
        description: 'Boolean | Run the LinkedIn enrichment | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: email
        in: query
        required: false
        description: (Optional) Email
        example: john.doe@fake.com
        schema:
          type: string
      - name: linkedinUrl
        in: query
        required: false
        description: (Optional) LinkedIn URL
        example: https://www.linkedin.com/in/john-doe
        schema:
          type: string
      - name: firstName
        in: query
        required: false
        description: (Optional) First name
        example: John
        schema:
          type: string
      - name: lastName
        in: query
        required: false
        description: (Optional) Last name
        example: Doe
        schema:
          type: string
      - name: companyDomain
        in: query
        required: false
        description: (Optional) Prospect company's domain
        example: https://www.fakecompany.com
        schema:
          type: string
      - name: companyName
        in: query
        required: false
        description: (Optional) Prospect company's name
        example: Fake company
        schema:
          type: string
      - name: findPhone
        in: query
        required: false
        description: 'Boolean | Find phone number | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: webhookUrl
        in: query
        required: false
        description: (Optional) Webhook URL for enrichment events
        example: https:/webhook.site/*your-webhook-id*/
        schema:
          type: string
      - name: Content
        in: header
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: enr_pRSGEaMP7rrCfFPx5
        '400':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Missing enrichment params
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: No enrichment requested (findEmail, findPhone, linkedinEnrichment or verifyEmail required)
    servers:
    - url: https://api.lemlist.com/api
  /leads/{leadId}/enrich:
    parameters:
    - name: leadId
      in: path
      required: true
      example: '{{leadId}}'
      schema:
        type: string
    post:
      summary: Enrich Lead
      tags:
      - Enrich
      parameters:
      - name: findEmail
        in: query
        required: false
        description: "Boolean | Search email address in another campaign, will not insert the lead if email address already inserted\n | Default: false"
        example: 'true'
        schema:
          type: boolean
      - name: verifyEmail
        in: query
        required: false
        description: "Boolean | Find verified email\n | Default: false"
        example: 'true'
        schema:
          type: boolean
      - name: linkedinEnrichment
        in: query
        required: false
        description: "Boolean | Run the LinkedIn enrichment\n | Default: false"
        example: 'true'
        schema:
          type: boolean
      - name: findPhone
        in: query
        required: false
        description: 'Boolean | Find phone number | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: webhookUrl
        in: query
        required: false
        description: (Optional) Webhook URL for enrichment events
        example: https:/webhook.site/*your-webhook-id*/
        schema:
          type: string
      - name: Content
        in: header
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '400':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Error Invalid leadId
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Invalid leadId
        default:
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: enr_gLpC97CBdER2kpn7z
    servers:
    - url: https://api.lemlist.com/api
  /v2/enrichments/bulk:
    parameters: []
    post:
      summary: Bulk enrichments
      tags:
      - Enrich
      parameters:
      - name: webhookUrl
        in: query
        required: false
        description: (Optional) Webhook URL for enrichment events
        example: https:/webhook.site/*your-webhook-id*/
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: find_email
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    metadata:
                      type: object
                      properties:
                        id:
                          type: string
              example:
              - id: enr_7y2vszPS5F6C9qLEg
                metadata:
                  id: some_id
              - id: enr_4e1vEfOA3F7D9dJHd
                metadata: some_id
              - error: MISSING_INPUTS
                metadata: some_id
        '400':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: WRONG_INPUT_FORMAT
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  input:
                    type: object
                    properties:
                      linkedinUrl:
                        type: string
                      email:
                        type: string
                      companyName:
                        type: string
                      companyDomain:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                  enrichmentRequests:
                    type: array
                    items:
                      type: string
                  metadata:
                    type: object
                    properties:
                      some_id:
                        type: string
            example:
            - input:
                linkedinUrl: '{{input_linkedin_url}}'
                email: '{{input_email}}'
                companyName: '{{input_company_name}}'
                companyDomain: '{{input_company_domain}}'
                firstName: '{{input_first_name}}'
                lastName: '{{input_last_name}}'
              enrichmentRequests:
              - find_email
              - find_phone
              - verify
              - linkedin_enrichment
              metadata:
                some_id: some_id
    servers:
    - url: https://api.lemlist.com/api
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- lemlist-openapi-v1-legacy.json
- lemlist-openapi-v2.json
- lemlist-openapi.yml
