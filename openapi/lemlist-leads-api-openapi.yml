        in: query
        required: false
        description: 'Boolean | Find verified email | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: findEmail
        in: query
        required: false
        description: 'Boolean | Run the LinkedIn enrichment | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: verifyEmail
        in: query
        required: false
        description: 'Boolean | Verify existing email (debounce) | Default: false'
        example: 'true'
        schema:
          type: boolean
      - name: findPhone
        in: query
        required: false
        description: 'Boolean | Find phone number | Default: false'
        example: 'true'
        schema:
          type: boolean
