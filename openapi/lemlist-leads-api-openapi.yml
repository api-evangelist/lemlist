    get:
      summary: Get CRM Filters
      tags:
      - Leads
      parameters:
      - name: crm
        in: query
        required: true
        description: CRM name (e.g., hubspot, salesforce, pipedrive)
        example: hubspot
        schema:
          type: string
      - name: userId
        in: query
        required: true
        description: Connected user ID
        example: usr_FU6yAd3UdBFel0UDy
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Filter type for Salesforce. Can be: lead, contact, or report.'
        example: lead
        schema:
          type: string
          enum:
          - lead
          - contact
          - report
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmFilter'
              example:
              - id: 16
                name: Filter 1
              - id: 17
                name: Filter 2
        '400':
          description: Bad team
          content:
            text/plain:
              example: Bad team
        '401':
          description: Unauthorized
  /campaigns/{campaignId}/leads/import:
    post:
      summary: Import Leads from CRM
      tags:
      - Leads
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                crm:
                  type: string
                  description: CRM name
                userId:
                  type: string
                  description: User ID with CRM connection
                filterId:
                  type: string
                  description: Filter ID from the CRM
                filterType:
                  type: string
                  description: Type of filter (for Salesforce)
                deduplicate:
                  type: boolean
                  description: Whether to deduplicate leads
              required:
              - crm
              - userId
              - filterId
            example:
              crm: hubspot
              userId: usr_FU6yAd3UdBFel0UDy
              filterId: '16'
              deduplicate: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                ok: true
        '400':
          description: Bad team
          content:
            text/plain:
              example: Bad team
        '401':
          description: Unauthorized
      parameters: []
    parameters:
    - name: campaignId
      in: path
      required: true
      description: The unique identifier of the campaign
      example: cam_A1B2C3D4E5F6G7H8I9
      schema:
        type: string
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CrmFilter:
      type: object
      description: A filter used in the CRM to segment leads or companies.
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
        criteria:
          type: object
          additionalProperties: true
