openapi: 3.2.0
info:
  title: Lemlist Leads API
  version: 1.0.0
  description: 'Operations tagged Leads across 3 of this provider''s published API definitions: lemlist-openapi-v1-legacy.json, lemlist-openapi-v2.json, lemlist-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.lemlist.com/api
tags:
- name: Leads
paths:
  /leads/start/{leadId}:
    parameters:
    - name: leadId
      in: path
      required: true
      example: '{{leadId}}'
      schema:
        type: string
    post:
      summary: Resume a paused Lead
      tags:
      - Leads
      parameters:
      - name: Content
        in: header
        required: false
        example: application/json
        schema:
          type: string
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
              example: application/json
          description: Success all campaign
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    firstName:
                      type: string
                    lastName:
                      type: string
                    picture:
                      type: string
                      format: uri
                    phone:
                      type: string
                      format: phone
                    linkedinUrl:
                      type: string
                      format: uri
                    companyName:
                      type: string
                    companyDomain:
                      type: string
                    icebreaker:
                      type: string
                    jobTitle:
                      type: string
                    _id:
                      type: string
                    isPaused:
                      type: boolean
                    campaignId:
                      type: string
              example:
              - email: john.doe@domain.com
                firstName: John
                lastName: Doe
                picture: https://c.pxhere.com/images/55/a2/fc589d408bc4c00cf38f1aeaf3e3-1449557.jpg!d
                phone: +33 123456789
                linkedinUrl: https://www.linkedin.com/in/johndoe,
                companyName: lempire
                companyDomain: lempire.co
                icebreaker: Hello John, I came across your profile and your expertise in software development is remarkable!
                jobTitle: Developer
                _id: lea_7kMNQwplxvvD2hf5z
                isPaused: false
                campaignId: cam_A1B2C3D4E5F6G7H8I9
              - firstname: John
                lastname: Doe
                companyName: lempire
                email: john.doe@domain.com
                _id: lea_3pRTJnkxwwF6vh1m
                isPaused: false
                campaignId: cam_K9L8M7N6O5P4Q3R2S1
