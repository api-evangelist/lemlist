"""
lemlist GraphQL Schema
Sales engagement and email outreach automation platform.
Source: https://developer.lemlist.com/
"""

# ─── Enumerations ────────────────────────────────────────────────────────────

enum CampaignStatus {
  DRAFT
  ACTIVE
  PAUSED
  STOPPED
  ARCHIVED
}

enum CampaignType {
  EMAIL
  LINKEDIN
  MULTICHANNEL
  API
}

enum CampaignStepType {
  EMAIL
  LINKEDIN_VISIT
  LINKEDIN_CONNECT
  LINKEDIN_MESSAGE
  MANUAL_CALL
  MANUAL_TASK
  API
}

enum LeadStatus {
  NOT_CONTACTED
  IN_PROGRESS
  CONTACTED
  INTERESTED
  NOT_INTERESTED
  BOUNCED
  UNSUBSCRIBED
  OPT_OUT
}

enum ActivityType {
  EMAIL_SENT
  EMAIL_OPENED
  EMAIL_CLICKED
  EMAIL_REPLIED
  EMAIL_BOUNCED
  EMAIL_UNSUBSCRIBED
  LINKEDIN_VISIT
  LINKEDIN_CONNECT_SENT
  LINKEDIN_CONNECTED
  LINKEDIN_MESSAGE_SENT
  LINKEDIN_REPLIED
  CALL_DONE
  TASK_DONE
  API_HOOK_TRIGGERED
  LEAD_CREATED
  LEAD_UPDATED
  LEAD_PAUSED
  LEAD_RESUMED
}

enum EmailStatus {
  PENDING
  SENT
  DELIVERED
  OPENED
  CLICKED
  REPLIED
  BOUNCED
  FAILED
}

enum WebhookEvent {
  EMAIL_SENT
  EMAIL_OPENED
  EMAIL_CLICKED
  EMAIL_REPLIED
  EMAIL_BOUNCED
  UNSUBSCRIBED
  LEAD_INTERESTED
  LEAD_NOT_INTERESTED
  LEAD_HOOK_TRIGGERED
}

enum ABTestStatus {
  RUNNING
  WINNER_PICKED
  COMPLETED
}

enum IntegrationType {
  SALESFORCE
  HUBSPOT
  PIPEDRIVE
  ZOHO
  SLACK
  ZAPIER
  MAKE
  PHANTOMBUSTER
  CUSTOM
}

# ─── Campaign Types ──────────────────────────────────────────────────────────

type Campaign {
  id: ID!
  name: String!
  status: CampaignStatus!
  type: CampaignType!
  createdAt: String!
  updatedAt: String!
  sendingSchedule: Schedule
  sender: Sender
  steps: [CampaignStep!]
  leads: [Lead!]
  report: Report
  abTests: [ABTest!]
  teamId: String
}

type CampaignDetails {
  id: ID!
  name: String!
  status: CampaignStatus!
  type: CampaignType!
  createdAt: String!
  updatedAt: String!
  sendingSchedule: Schedule
  sender: Sender
  steps: [CampaignStep!]!
  leads: [Lead!]
  report: Report
  abTests: [ABTest!]
  sequences: [Sequence!]
  webhooks: [Webhook!]
  teamId: String
  settings: CampaignSettings
}

type CampaignSettings {
  stopOnReply: Boolean
  stopOnClick: Boolean
  trackOpens: Boolean
  trackClicks: Boolean
  dailyLimit: Int
  timezone: String
}

type CampaignStep {
  id: ID!
  campaignId: ID!
  type: CampaignStepType!
  order: Int!
  delay: StepDelay
  details: StepDetails
  enabled: Boolean!
}

type StepDetails {
  subject: String
  body: String
  linkedinMessage: String
  callInstructions: String
  taskInstructions: String
  apiUrl: String
  apiMethod: String
  apiBody: String
  personalizationTags: [PersonalizationTag!]
}

type StepDelay {
  amount: Int!
  unit: String!
}

type Step {
  id: ID!
  type: CampaignStepType!
  order: Int!
  delay: StepDelay
}

type EmailStep {
  id: ID!
  campaignId: ID!
  order: Int!
  delay: StepDelay
  subject: String!
  body: String!
  isReply: Boolean
  trackOpens: Boolean
  trackClicks: Boolean
  personalizationTags: [PersonalizationTag!]
  smartLiquid: [SmartLiquid!]
}

type LinkedinStep {
  id: ID!
  campaignId: ID!
  order: Int!
  delay: StepDelay
  actionType: String!
  message: String
  connectionNote: String
}

type CallStep {
  id: ID!
  campaignId: ID!
  order: Int!
  delay: StepDelay
  instructions: String
}

type ApiStep {
  id: ID!
  campaignId: ID!
  order: Int!
  delay: StepDelay
  url: String!
  method: String!
  headers: String
  body: String
}

type Hook {
  id: ID!
  campaignId: ID!
  stepId: ID
  event: WebhookEvent!
  url: String!
  active: Boolean!
  createdAt: String!
}

# ─── Sequence Types ──────────────────────────────────────────────────────────

type Sequence {
  id: ID!
  name: String!
  campaignId: ID!
  steps: [SequenceStep!]!
  createdAt: String!
}

type SequenceDetails {
  id: ID!
  name: String!
  campaignId: ID!
  steps: [SequenceStep!]!
  createdAt: String!
  updatedAt: String!
  leadCount: Int
}

type SequenceStep {
  id: ID!
  sequenceId: ID!
  type: CampaignStepType!
  order: Int!
  delay: StepDelay
  details: StepDetails
}

