# ─── Root Operations ──────────────────────────────────────────────────────────

type Query {
  campaign(id: ID!): CampaignDetails
  campaigns(status: CampaignStatus, type: CampaignType, limit: Int, offset: Int): [Campaign!]!
  campaignReport(id: ID!): Report
  campaignStats(id: ID!, startDate: String, endDate: String): [Stat!]!
  campaignLeads(campaignId: ID!, status: LeadStatus, limit: Int, offset: Int): [Lead!]!

  lead(id: ID!): LeadDetails
  leadByEmail(email: String!): LeadDetails
  leads(campaignId: ID, status: LeadStatus, limit: Int, offset: Int): [Lead!]!
  leadActivities(leadId: ID!, limit: Int, offset: Int): [LeadActivity!]!

  sequence(id: ID!): SequenceDetails
  sequences(campaignId: ID!): [Sequence!]!

  team: TeamDetails
  sender(id: ID!): SenderDetails
  senders: [Sender!]!

  schedule(id: ID!): Schedule
  schedules: [Schedule!]!

  inbox(senderId: ID!): Inbox

  blacklist: Blacklist

  list(id: ID!): ListDetails
  lists(limit: Int, offset: Int): [List!]!

  template(id: ID!): TemplateDetails
  templates(type: String, limit: Int, offset: Int): [Template!]!

  webhooks(campaignId: ID): [Webhook!]!

  integrations: [Integration!]!
  salesforceIntegration: SalesforceIntegration
  hubspotIntegration: HubSpotIntegration

  abTest(id: ID!): ABTest
  abTests(campaignId: ID!): [ABTest!]!

  apiKeys: [APIKey!]!
}

type Mutation {
  createCampaign(name: String!, type: CampaignType!, senderId: ID): Campaign!
  updateCampaign(id: ID!, name: String, status: CampaignStatus, senderId: ID): Campaign!
  deleteCampaign(id: ID!): Boolean!
  pauseCampaign(id: ID!): Campaign!
  resumeCampaign(id: ID!): Campaign!

  addEmailStep(campaignId: ID!, order: Int!, subject: String!, body: String!, delay: Int): CampaignStep!
  addLinkedinStep(campaignId: ID!, order: Int!, actionType: String!, message: String, delay: Int): CampaignStep!
  addCallStep(campaignId: ID!, order: Int!, instructions: String, delay: Int): CampaignStep!
  updateStep(id: ID!, subject: String, body: String, delay: Int): CampaignStep!
  deleteStep(id: ID!): Boolean!

  addLead(campaignId: ID!, email: String!, firstName: String, lastName: String, companyName: String, variables: String): Lead!
  updateLead(id: ID!, status: LeadStatus, variables: String): Lead!
  deleteLead(id: ID!): Boolean!
  pauseLead(campaignId: ID!, leadId: ID!): Lead!
  resumeLead(campaignId: ID!, leadId: ID!): Lead!
  markLeadInterested(campaignId: ID!, leadId: ID!, notes: String): Lead!
  markLeadNotInterested(campaignId: ID!, leadId: ID!): Lead!
  unsubscribeLead(email: String!, campaignId: ID): Unsubscribe!

  addToBlacklist(value: String!, type: String!): BlacklistEntry!
  removeFromBlacklist(id: ID!): Boolean!

  createList(name: String!): List!
  updateList(id: ID!, name: String): List!
  deleteList(id: ID!): Boolean!
  addLeadToList(listId: ID!, email: String!): ListMember!
  removeLeadFromList(listId: ID!, leadId: ID!): Boolean!

  createWebhook(url: String!, events: [WebhookEvent!]!, campaignId: ID, secret: String): Webhook!
  updateWebhook(id: ID!, url: String, events: [WebhookEvent!], active: Boolean): Webhook!
  deleteWebhook(id: ID!): Boolean!

  createTemplate(name: String!, body: String!, subject: String, type: String!): Template!
  updateTemplate(id: ID!, name: String, body: String, subject: String): Template!
  deleteTemplate(id: ID!): Boolean!

  createSchedule(name: String!, timezone: String!, days: [String!]!, startHour: String!, endHour: String!): Schedule!
  updateSchedule(id: ID!, name: String, timezone: String, days: [String!], startHour: String, endHour: String): Schedule!
  deleteSchedule(id: ID!): Boolean!

  createAPIKey(name: String!): APIKey!
  deleteAPIKey(id: ID!): Boolean!
}

type Subscription {
  emailSent(campaignId: ID): Email!
  emailOpened(campaignId: ID): Opened!
  emailClicked(campaignId: ID): Clicked!
  emailReplied(campaignId: ID): Replied!
  emailBounced(campaignId: ID): Bounce!
  leadUnsubscribed(campaignId: ID): Unsubscribe!
  leadInterested(campaignId: ID): Interest!
  activityLogged(campaignId: ID): Activity!
}
