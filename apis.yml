aid: lemlist
name: lemlist
description: lemlist is a cold email outreach and sales engagement platform that helps
  sales teams build prospect lists, personalize multichannel campaigns across email
  and LinkedIn, and automate follow-ups to book more meetings. It includes a built-in
  B2B lead database, AI-generated personalization, and warm-up tools to keep deliverability
  healthy. The lemlist API enables developers to integrate lemlist with other tools
  and automate outreach workflows using API key authentication.
