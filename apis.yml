apis:
- aid: lemlist:mcp-server
  name: lemlist MCP Server
  description: >-
    lemlist's hosted remote Model Context Protocol server. An MCP client POSTs to https://app.lemlist.com/mcp
    and authenticates with OAuth 2.1 (authorization code + PKCE, dynamic client registration) or an X-API-Key
    header. lemlist advertises roughly 40 tools covering lead search, enrichment, campaign and sequence
    management, stats, the inbox and webhooks.
  humanURL: https://developer.lemlist.com/mcp/setup
  baseURL: https://app.lemlist.com/mcp
