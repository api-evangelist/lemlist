aid: lemlist
name: lemlist
description: lemlist is a sales engagement and cold outreach platform from lempire that
  helps sales teams build prospect lists, personalize multichannel campaigns across email,
  LinkedIn, phone, SMS and WhatsApp, and automate follow-ups to book more meetings. It
  includes a 650M+ record B2B lead database, credit-metered email and phone enrichment,
  Signal Agents that watch for buying triggers, a unified reply inbox, and lemwarm
  deliverability warm-up. The developer surface is unusually agent-forward for its
  category - a 143-operation REST API documented with a published OpenAPI, a hosted
  remote MCP server at app.lemlist.com/mcp with OAuth 2.1 and dynamic client
  registration, an official OpenAPI-generated CLI on npm, an llms.txt index, a
  published Agent Skill, and a 76-event webhook catalog.
