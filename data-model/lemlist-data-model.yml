envelope_schemas:
  note: >-
    A further set of schemas are pagination/response envelopes rather than domain
    entities — ScheduleListResponse, LeadListResponse, TaskListResponse,
    InboxConversationPagination, InboxMessagePagination, PersonaListResponse,
    PersonaCreateResponse, PersonaDeleteResponse, PersonaError, WatchListApi*Response,
    WatchListListMeta, ExternalSignalPushResponse. The recurring list shape is
    {results, page, total}, but it is not applied consistently across the surface.
key_distinctions:
- pair: Lead vs Contact
  detail: >-
    A Lead belongs to a campaign; a Contact lives in the CRM and belongs to the team.
    They are separate objects — pushing leads to contacts creates a copy. lemlist calls
    this out in its own Agent Skill because it is the most common integration mistake.
- pair: sequenceStep vs stepId
  detail: >-
    sequenceStep is a 0-based position that shifts when a sequence is reordered;
    stepId is stable. Store stepId.
- pair: Persona vs WatchList (Signal Agent)
  detail: >-
    A Persona is a saved people-database search; a Signal Agent watches for events on
    an audience and emits Signals.
